server:
  error:
    include-message: always
    include-stacktrace: never

spring:
  profiles:
    active: ${SPRING_PROFILES_ACTIVE:local}
  autoconfigure:
    exclude:
      - org.springdoc.core.configuration.SpringDocHateoasConfiguration
  datasource:
    driver-class-name: org.postgresql.Driver
  jpa:
    open-in-view: false
    show-sql: true
    properties:
      hibernate:
        dialect: org.hibernate.dialect.PostgreSQLDialect
        format_sql: true

security:
  secret-key: ${JWT_SECRET_KEY:booklibre-secret-key-2026-unsam-grupo10-dev-only}
  access-token-minutes: 30
  refresh-token-days: 7

---
spring:
  config:
    activate:
      on-profile: local
  datasource:
    url: jdbc:postgresql://localhost:5432/db_booklibre
    username: booklibre
    password: booklibre
  jpa:
    hibernate:
      ddl-auto: update
  data:
    mongodb:
      uri: mongodb://localhost:27017/booklibre
      auto-index-creation: true
    redis:
      host: localhost
      port: 6379

---
spring:
  config:
    activate:
      on-profile: docker
  datasource:
    url: jdbc:postgresql://postgres:5432/db_booklibre
    username: booklibre
    password: booklibre
  jpa:
    hibernate:
      ddl-auto: update
  data:
    mongodb:
      uri: mongodb://mongo:27017/booklibre
      auto-index-creation: true
    redis:
      host: redis
      port: 6379

---
spring:
  config:
    activate:
      on-profile: prod
  datasource:
    url: ${DB_URL}
    username: ${DB_USERNAME}
    password: ${DB_PASSWORD}
  jpa:
    hibernate:
      ddl-auto: update
    show-sql: false
  data:
    mongodb:
      uri: ${MONGO_URI}
      auto-index-creation: true
    redis:
      url: ${REDIS_URL}
